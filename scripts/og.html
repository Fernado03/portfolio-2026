<!doctype html>
<!--
  Source for public/og-image.png. Not shipped, not imported by the build.
  Regenerate: serve the repo with `npm run dev`, open /scripts/og.html at a
  1200x630 viewport, screenshot, save over public/og-image.png.
-->
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="stylesheet" href="/node_modules/@fontsource-variable/newsreader/index.css" />
  <link rel="stylesheet" href="/node_modules/@fontsource-variable/geist/index.css" />
  <link rel="stylesheet" href="/node_modules/@fontsource-variable/geist-mono/index.css" />
  <style>
    :root {
      --bg: rgb(251 250 248);
      --bg-subtle: rgb(243 241 237);
      --ink: rgb(20 16 12);
      --ink-muted: rgb(107 98 90);
      --line: rgb(226 221 213);
      --accent: rgb(154 52 18);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 1200px;
      height: 630px;
      overflow: hidden;
    }

    body {
      background: var(--bg);
      color: var(--ink);
      font-family: 'Geist Variable', system-ui, sans-serif;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 68px 80px 0;
      position: relative;
    }

    /* Lab rules — the same hairline column pair the site uses. */
    .rules {
      position: absolute;
      inset: 0;
      border-left: 1px solid var(--line);
      border-right: 1px solid var(--line);
      margin: 0 40px;
      pointer-events: none;
    }

    .eyebrow {
      font-family: 'Geist Mono Variable', ui-monospace, monospace;
      font-size: 16px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--accent);
    }

    .eyebrow .idx {
      color: var(--ink-muted);
    }

    .eyebrow .sep {
      color: var(--line);
      padding: 0 6px;
    }

    h1 {
      font-family: 'Newsreader Variable', Georgia, serif;
      font-weight: 500;
      font-size: 104px;
      line-height: 0.94;
      letter-spacing: -0.03em;
      margin-top: 22px;
    }

    .lede {
      margin-top: 24px;
      max-width: 46ch;
      font-size: 24px;
      line-height: 1.5;
      color: var(--ink-muted);
    }

    dl {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      border-top: 1px solid var(--line);
      margin: 0 -80px;
      padding: 0 80px;
    }

    dl>div {
      padding: 26px 24px 34px 0;
      border-right: 1px solid var(--line);
    }

    dl>div:last-child {
      border-right: 0;
    }

    dt {
      font-family: 'Newsreader Variable', Georgia, serif;
      font-size: 40px;
      font-weight: 500;
      letter-spacing: -0.02em;
    }

    dd {
      font-family: 'Geist Mono Variable', ui-monospace, monospace;
      font-size: 13px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--ink-muted);
      margin-top: 8px;
      line-height: 1.4;
    }
  </style>
</head>

<body>
  <div class="rules"></div>

  <header>
    <p class="eyebrow"><span class="idx">00</span><span class="sep">/</span>Data Scientist &amp; AI Engineer</p>
    <h1>Fernado George</h1>
    <p class="lede">Retrieval and computer-vision systems that ship — benchmarked, deployed, and running on real
      footage.</p>
  </header>

  <dl>
    <div>
      <dt>71.6%</dt>
      <dd>Thesis F1 (multimodal)</dd>
    </div>
    <div>
      <dt>3.75</dt>
      <dd>CGPA · Dean's List</dd>
    </div>
    <div>
      <dt>2</dt>
      <dd>Client systems in production</dd>
    </div>
    <div>
      <dt>4</dt>
      <dd>Hackathons · 1 Gold, 1 runner-up</dd>
    </div>
  </dl>
</body>

</html>
