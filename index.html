  <!-- Theme colour follows the active surface so mobile chrome matches -->
  <meta name="theme-color" content="#FBFAF8" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#0B0A09" media="(prefers-color-scheme: dark)" />

  <!--
    Resolve the theme before first paint: a stored choice wins, otherwise follow
    the OS. Without this the app mounts light and repaints dark, which reads as
    a flash on reload.
  -->
  <script>
    (function () {
      try {
        var s = localStorage.getItem("theme");
        var dark = s === "dark" || (s !== "light" && matchMedia("(prefers-color-scheme: dark)").matches);
        if (dark) document.documentElement.classList.add("dark");
      } catch (_) { /* storage blocked — fall back to the light default */ }
    })();
  </script>
